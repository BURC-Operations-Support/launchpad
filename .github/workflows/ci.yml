
name: Launchpad CI/CD

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/burc-operations-support/launchpad

jobs:
  verify:
    name: Build and verify Launchpad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and verify image
        run: make check

      - name: Authenticate with GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'push'
        run: |
          docker tag launchpad:dev "${IMAGE}:main"
          docker tag launchpad:dev "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:main"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"

    permissions:
      contents: read
      packages: write
